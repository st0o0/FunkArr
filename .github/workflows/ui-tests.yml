name: UI Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/FunkArr.UI/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/FunkArr.UI/**'
      - '.github/workflows/e2e-tests.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FunkArr.UI
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/FunkArr.UI/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: npx playwright install --with-deps chromium

      - run: pnpm run test:ui

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: src/FunkArr.UI/playwright-report/
          retention-days: 7
