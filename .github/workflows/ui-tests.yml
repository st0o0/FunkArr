name: UI Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/FunkArr.UI/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FunkArr.UI
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/FunkArr.UI/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: src/FunkArr.UI/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        name: Type check and build

      - run: pnpm test
        name: Vitest unit tests
