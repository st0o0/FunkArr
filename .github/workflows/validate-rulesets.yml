name: validate-rulesets

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  pull_request:
    paths:
      - 'data/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats
      - name: Validate community rulesets against schema
        run: ajv validate -s data/community/ruleset.schema.json -d "data/community/rulesets/*.json" --spec=draft2020 --strict=false
