services:
  funkarr:
    image: ghcr.io/st0o0/funkarr:latest
    restart: unless-stopped
    ports:
      - "8080:6969"
    volumes:
      - funkarr-data:/app/data
      - /path/to/media:/media
    environment:
      # -- API Key --
      # Used by Prowlarr/Sonarr/Radarr to authenticate requests.
      # Default: funkarr-default-api-key
      #- FunkArr__ApiKey=funkarr-default-api-key

      # -- Data --
      # Base path for all persistent data (database, rulesets, temp files).
      # Default: data (relative to /app inside the container)
      #- FunkArr__DataPath=data

      # -- Downloads --
      # Root directory for downloads. Contains incomplete/ and complete/ subdirs.
      # Default: data/downloads
      - FunkArr__Download__Path=/media/downloads
      # Max concurrent downloads. Default: 3
      #- FunkArr__Download__ConcurrentDownloads=3

      # -- RuleSets --
      # GitHub repository for community rulesets (owner/repo). Default: st0o0/funkarr
      #- FunkArr__RuleSet__Repository=st0o0/funkarr
      # Pin to a specific ruleset version, or "latest". Default: latest
      #- FunkArr__RuleSet__Version=latest
      # Enable/disable automatic refresh from GitHub. Default: true
      #- FunkArr__RuleSet__RefreshEnabled=true

      # -- Metadata Resolution --
      # TMDB API key for movie/series title resolution (free at themoviedb.org)
      #- FunkArr__Tmdb__ApiKey=your-tmdb-api-key
      # TVDB API key for episode guide resolution
      #- FunkArr__Tvdb__ApiKey=your-tvdb-api-key

      # -- Persistence (PostgreSQL) --
      # Default: SQLite at data/funkarr.db (no extra config needed).
      # Set Postgres__Host to switch to PostgreSQL.
      #- FunkArr__Postgres__Host=db
      #- FunkArr__Postgres__Port=5432
      #- FunkArr__Postgres__User=funkarr
      #- FunkArr__Postgres__Password=changeme
      #- FunkArr__Postgres__Database=funkarr

  # -- Uncomment for PostgreSQL persistence --
  # db:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   volumes:
  #     - db-data:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_DB: funkarr
  #     POSTGRES_USER: funkarr
  #     POSTGRES_PASSWORD: changeme

volumes:
  funkarr-data:
  # db-data:
