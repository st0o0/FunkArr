services:
  funkarr:
    container_name: funkarr
    build: .
    ports:
      - "6969:6969"
    volumes:
      - funkarr-data:/app/data
      - media:/shared
    environment:
      - PUID=1654
      - PGID=1654
      - Serilog__MinimumLevel__Default=Debug
      - Serilog__MinimumLevel__Override__Akka=Information
      - FunkArr__ApiKey=funkarr-dev-api-key-01
      - FunkArr__BaseUrl=http://funkarr:6969
      - FunkArr__Tvdb__ApiKey=${TVDB_API_KEY:-}
      - FunkArr__Tmdb__ApiKey=${TMDB_API_KEY:-}
      - FunkArr__Download__Path=/shared/downloads
      - FunkArr__Download__ConcurrentDownloads=2
      # Network routes (requires proxy profile: docker compose -f docker-compose.dev.yml --profile proxy up -d)
      - FunkArr__Routes__Definitions__0__Name=Direct
      - FunkArr__Routes__Definitions__1__Name=Austria
      - FunkArr__Routes__Definitions__1__Proxy=http://gluetun-at:8888
      - FunkArr__Routes__ChannelRoutes__0__Pattern=ORF*
      - FunkArr__Routes__ChannelRoutes__0__Route=Austria
      - FunkArr__Routes__Default=Direct
    depends_on:
      - sonarr
      - radarr
      - prowlarr

  sonarr:
    container_name: sonarr
    image: ghcr.io/home-operations/sonarr:rolling@sha256:ec7797f30e65cc411fba6768ed575337a5787de7d06c382173df610f2d23a317
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - media:/shared
    environment:
      SONARR__AUTH__APIKEY: funkarr-dev-api-key-01
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses

  radarr:
    container_name: radarr
    image: ghcr.io/home-operations/radarr:rolling@sha256:55d3cf8a4c4c531bb8b5c1ba88eb270d4435e01e228fbdb16cdfc910a17e3b06
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - media:/shared
    environment:
      RADARR__AUTH__APIKEY: funkarr-dev-api-key-01
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/home-operations/prowlarr:rolling@sha256:15b68a6e69f893a3ede6fed405594d3f5d9e9d13648246a0fefbafe4fd7f595b
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      PROWLARR__AUTH__APIKEY: funkarr-dev-api-key-01
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses

  gluetun-at:
    container_name: gluetun-at
    image: qmcgaw/gluetun@sha256:3c43ec327d7ab2b5f1dc798b92a7640de9a1e1b74a81c9a5143adb383c03d28b
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY:-}
      - WIREGUARD_PRESHARED_KEY=${WG_PRESHARED_KEY:-}
      - WIREGUARD_ADDRESSES=${WG_ADDRESSES:-}
      - SERVER_COUNTRIES=Austria
      - HTTPPROXY=on
      - HTTPPROXY_LOG=on
    profiles:
      - proxy

volumes:
  funkarr-data:
  media:
  sonarr-config:
  radarr-config:
  prowlarr-config:
