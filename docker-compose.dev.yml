services:
  funkarr:
    container_name: funkarr
    build: .
    ports:
      - "6969:6969"
    volumes:
      - funkarr-data:/app/data
      - media:/shared
    environment:
      - Serilog__MinimumLevel__Default=Debug
      - Serilog__MinimumLevel__Override__Akka=Information
      - FunkArr__ApiKey=funkarr-dev-api-key-01
      - FunkArr__Tvdb__ApiKey=${TVDB_API_KEY:-}
      - FunkArr__Tmdb__ApiKey=${TMDB_API_KEY:-}
      - FunkArr__Download__Path=/shared/downloads
      - FunkArr__Download__ConcurrentDownloads=50
    depends_on:
      - sonarr
      - radarr
      - prowlarr

  sonarr:
    container_name: sonarr
    image: ghcr.io/home-operations/sonarr:rolling@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - media:/shared
    environment:
      SONARR__AUTH__APIKEY: funkarr-dev-api-key-01
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses

  radarr:
    container_name: radarr
    image: ghcr.io/home-operations/radarr:rolling@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - media:/shared
    environment:
      RADARR__AUTH__APIKEY: funkarr-dev-api-key-01
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/home-operations/prowlarr:rolling@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      PROWLARR__AUTH__APIKEY: funkarr-dev-api-key-01
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses

volumes:
  funkarr-data:
  media:
  sonarr-config:
  radarr-config:
  prowlarr-config:
