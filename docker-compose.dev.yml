services:
  funkarr:
    container_name: funkarr
    build: .
    ports:
      - "6969:6969"
    volumes:
      - funkarr-data:/app/data
      - media:/shared
    environment:
      - PUID=1654
      - PGID=1654
      - Serilog__MinimumLevel__Default=Debug
      - Serilog__MinimumLevel__Override__Akka=Information
      - FunkArr__ApiKey=funkarr-dev-api-key-01
      - FunkArr__Tvdb__ApiKey=${TVDB_API_KEY:-}
      - FunkArr__Tmdb__ApiKey=${TMDB_API_KEY:-}
      - FunkArr__Download__Path=/shared/downloads
      - FunkArr__Download__ConcurrentDownloads=50
      # Network routes (requires proxy profile: docker compose -f docker-compose.dev.yml --profile proxy up -d)
      - FunkArr__Routes__Definitions__0__Name=Direct
      - FunkArr__Routes__Definitions__1__Name=Austria
      - FunkArr__Routes__Definitions__1__Proxy=http://gluetun-at:8888
      - FunkArr__Routes__ChannelRoutes__0__Pattern=ORF*
      - FunkArr__Routes__ChannelRoutes__0__Route=Austria
      - FunkArr__Routes__Default=Direct
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      - sonarr
      - radarr
      - prowlarr

  aspire-dashboard:
    container_name: aspire-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5@sha256:0ef531119b8073aed12b0db2b4e4ab02866c6c69b7a52264269abd00cfb48a34
    ports:
      - "18888:18888"
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true

  sonarr:
    container_name: sonarr
    image: ghcr.io/home-operations/sonarr:rolling@sha256:1f19eb5e0f421418c1a956bbe01310a0141423afe28bd9a4b1dcb8629ff2bce2
    ports:
      - "8989:8989"
    volumes:
      - sonarr-config:/config
      - media:/shared
    environment:
      SONARR__AUTH__APIKEY: funkarr-dev-api-key-01
      SONARR__AUTH__METHOD: External
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses

  radarr:
    container_name: radarr
    image: ghcr.io/home-operations/radarr:rolling@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
    ports:
      - "7878:7878"
    volumes:
      - radarr-config:/config
      - media:/shared
    environment:
      RADARR__AUTH__APIKEY: funkarr-dev-api-key-01
      RADARR__AUTH__METHOD: External
      RADARR__AUTH__REQUIRED: DisabledForLocalAddresses

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/home-operations/prowlarr:rolling@sha256:6152751c3ea2e7751564f5952173d5e83eed0e09f3fabd2cb6bdb58690c39e2f
    ports:
      - "9696:9696"
    volumes:
      - prowlarr-config:/config
    environment:
      PROWLARR__AUTH__APIKEY: funkarr-dev-api-key-01
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses

  tinyproxy-at:
    container_name: tinyproxy-at
    image: kalaksi/tinyproxy@sha256:fafafc7079ca29c6704564de1353f61d038f2166f09b01d4e460e8e499bf6b57
    restart: unless-stopped
    network_mode: "service:gluetun-at"
    environment:
      - PORT=8888
      - TIMEOUT=600
      - LOGLEVEL=Info
    profiles:
      - proxy

  gluetun-at:
    container_name: gluetun-at
    image: qmcgaw/gluetun@sha256:5cedd587404f96202060385d541faa4a73e51544ea098ec8d31c614f4d9c6ee0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER:-}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WG_PRIVATE_KEY:-}
      - WIREGUARD_PRESHARED_KEY=${WG_PRESHARED_KEY:-}
      - WIREGUARD_ADDRESSES=${WG_ADDRESSES:-}
      - SERVER_COUNTRIES=Austria
    profiles:
      - proxy

volumes:
  funkarr-data:
  media:
  sonarr-config:
  radarr-config:
  prowlarr-config:
